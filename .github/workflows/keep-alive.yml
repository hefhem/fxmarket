name: Keep Supabase Alive

on:
  schedule:
    # Run every 6 days to prevent Supabase free tier from pausing
    - cron: '0 12 */6 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/currency_pairs?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Trigger fetch-events
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/fetch-events" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"
